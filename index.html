<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dofus Multi-Tracker</title>
    <!-- Favicon Dofus -->
    <link rel="icon" type="image/png" href="https://www.dofus.com/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFFFFF; }
        .class-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border-color: #F3F4F6; color: var(--class-color); }
        .class-btn.active { transform: scale(1.1); background-color: rgba(0,0,0,0.03); border-color: var(--class-color) !important; opacity: 1; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        .class-btn.inactive { opacity: 0.15; filter: grayscale(1); border-color: #F3F4F6 !important; background-color: transparent !important; transform: scale(1); }
        header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="pb-20 text-gray-900">

    <header class="sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-md mx-auto px-6 py-4">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-xl font-extrabold tracking-tighter italic">DOFUS<span class="text-[#B1C42E]">TRACKER</span></h1>
                    <p id="current-date" class="text-[10px] text-gray-400 font-bold uppercase tracking-widest"></p>
                </div>
                <div class="flex items-center gap-1">
                    <!-- Bouton Reset Journalier -->
                    <button onclick="resetDailyOnly()" class="p-2 text-blue-400 hover:text-blue-600 transition-colors" title="Reset Quotidien">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                    <!-- Bouton Reset Global - Rouge Vif -->
                    <button onclick="resetAll()" class="p-2 text-red-600 hover:text-red-800 transition-colors" title="Tout effacer">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            </div>
            
            <div class="bg-gray-50 rounded-3xl p-4 border border-gray-100 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Progression Globale</span>
                    <span id="global-percent" class="font-black text-[#B1C42E]">0%</span>
                </div>
                <div class="w-full bg-gray-200 h-1.5 rounded-full overflow-hidden">
                    <div id="global-progress-bar" class="bg-[#B1C42E] h-full w-0 transition-all duration-700"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 mt-6 space-y-10">
        <section>
            <h2 class="text-[11px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-[#B1C42E]"></span> Journalières
            </h2>
            <div id="daily-container" class="space-y-1 divide-y divide-gray-50"></div>
        </section>

        <section>
            <h2 class="text-[11px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-400"></span> Hebdomadaires
            </h2>
            <div id="weekly-container" class="space-y-1 divide-y divide-gray-50"></div>
        </section>

        <p id="global-count" class="text-center text-[10px] text-gray-300 font-bold uppercase py-6 tracking-widest">0 / 0 quêtes terminées</p>
    </main>

    <script>
        const classes = [
            { id: 'cra', icon: '🏹', color: '#EA580C' },
            { id: 'enu', icon: '💰', color: '#2563EB' },
            { id: 'feca', icon: '🛡️', color: '#0891B2' },
            { id: 'panda', icon: '🐼', color: '#15803D' }
        ];

        const dailyQuests = [
            { id: 'alma', title: 'Almanax', icon: '📅', hint: null },
            { id: 'steak', title: 'Steak de dragodinde', icon: '🥩', hint: 'Viande avariée x25' },
            { id: 'hue', title: 'Aller Hue', icon: '🐴', hint: 'Dragodinde Amande' },
            { id: 'kerub', title: "Bien velu c'est Kérubim", icon: '🐱', hint: null }
        ];

        const weeklyQuests = [
            { id: 'brille', title: 'Il faut que cha brille', icon: '✨' },
            { id: 'ecole', title: 'L\'école fantastique', icon: '🎓' },
            { id: 'fight', title: 'Fight Club', icon: '🥊' }
        ];

        let db = JSON.parse(localStorage.getItem('dofus_tracker_v3')) || {};

        function toggleQuest(questId, classId) {
            if (!db[questId]) db[questId] = {};
            db[questId][classId] = !db[questId][classId];
            localStorage.setItem('dofus_tracker_v3', JSON.stringify(db));
            render();
        }

        function createRow(q) {
            const row = document.createElement('div');
            row.className = 'py-4 flex justify-between items-center';
            let buttonsHtml = '';
            classes.forEach(c => {
                const isChecked = db[q.id] && db[q.id][c.id];
                buttonsHtml += `<button onclick="toggleQuest('${q.id}', '${c.id}')" class="class-btn w-9 h-9 rounded-2xl border-2 flex items-center justify-center text-base ${isChecked ? 'active shadow-sm' : 'inactive'}" style="--class-color: ${c.color};">${c.icon}</button>`;
            });

            const subText = q.hint ? `<p class="text-[10px] text-gray-400 font-medium italic leading-none mt-0.5">${q.hint}</p>` : '';

            row.innerHTML = `<div class="flex items-center gap-3 pr-2 overflow-hidden"><div class="min-w-[32px] w-8 h-8 bg-gray-50 rounded-xl flex items-center justify-center text-sm shadow-sm">${q.icon}</div><div class="overflow-hidden"><span class="font-bold text-gray-800 text-[13px] leading-tight tracking-tight block truncate">${q.title}</span>${subText}</div></div><div class="flex gap-3 shrink-0">${buttonsHtml}</div>`;
            return row;
        }

        function render() {
            const dailyContainer = document.getElementById('daily-container');
            const weeklyContainer = document.getElementById('weekly-container');
            dailyContainer.innerHTML = '';
            weeklyContainer.innerHTML = '';
            let totalDone = 0;
            const allQuests = [...dailyQuests, ...weeklyQuests];
            
            dailyQuests.forEach(q => dailyContainer.appendChild(createRow(q)));
            weeklyQuests.forEach(q => weeklyContainer.appendChild(createRow(q)));
            
            allQuests.forEach(q => { classes.forEach(c => { if (db[q.id] && db[q.id][c.id]) totalDone++; }); });
            const totalPossible = allQuests.length * classes.length;
            const percent = totalPossible > 0 ? Math.round((totalDone / totalPossible) * 100) : 0;
            
            document.getElementById('global-percent').innerText = percent + '%';
            document.getElementById('global-progress-bar').style.width = percent + '%';
            document.getElementById('global-count').innerText = `${totalDone} / ${totalPossible} quêtes terminées`;
        }

        function resetDailyOnly() {
            if(confirm("Réinitialiser les quêtes journalières uniquement ?")) {
                dailyQuests.forEach(q => { db[q.id] = {}; });
                localStorage.setItem('dofus_tracker_v3', JSON.stringify(db));
                render();
            }
        }

        function resetAll() {
            if(confirm("Réinitialiser absolument tout ?")) {
                db = {};
                localStorage.removeItem('dofus_tracker_v3');
                render();
            }
        }

        // Init
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
        render();
    </script>
</body>
</html>
